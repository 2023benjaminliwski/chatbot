<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Leo - Asistente de Autos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <!-- Encabezado del Chat -->
        <header class="chat-header">
            <div class="bot-info">
                <span class="bot-avatar">🏎️</span>
                <div>
                    <h1>Leo</h1>
                    <p class="status">En línea - Tu experto divertido en autos</p>
                </div>
            </div>
        </header>

        <!-- Zona de Chat (Donde se muestran los mensajes) -->
        <main id="zona-chat" class="zona-chat">
            <!-- Los mensajes se generan dinámicamente aquí -->
        </main>

        <!-- Respuestas Rápida (Zona de opciones y botones de interacción) -->
        <footer id="respuestas-rapidas" class="respuestas-rapidas">
            <!-- Los botones e inputs se generan dinámicamente aquí -->
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
